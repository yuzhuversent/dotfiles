# ~/.tmux.conf
# Tmux configuration

# ── Prefix ────────────────────────────────────────────────────────────────────
# Change prefix from C-b to C-a (screen-like)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # true color support

set -g history-limit 10000
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # renumber windows when one is closed

set -g escape-time 0           # no delay for escape key
set -g repeat-time 300
set -g focus-events on

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=colour235,fg=colour136"

set -g status-left-length 30
set -g status-left "#[fg=colour148,bold][#S] "

set -g status-right-length 60
set -g status-right "#[fg=colour136]%Y-%m-%d %H:%M #[fg=colour148,bold]#H"

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour81,bold] #I:#W "
setw -g window-status-current-style  "bg=colour238"

# ── Key bindings ─────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
unbind '"'
unbind '%'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-Left  previous-window
bind -n M-Right next-window

# ── Copy mode (vi keys) ───────────────────────────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Paste
bind p paste-buffer

# ── Pane borders ─────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour51"

# ── Messages ─────────────────────────────────────────────────────────────────
set -g message-style "bg=colour235,fg=colour166"
